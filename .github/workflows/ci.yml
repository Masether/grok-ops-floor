name: CI

# Replaces the stock "NodeJS with Webpack" starter workflow, which could never
# have passed here: this project builds with Vite, has no webpack config for
# `npx webpack` to find, and Vite 8 needs Node >=22.12, so the 18.x and 20.x
# legs of that matrix were dead on arrival too.

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          # Vite 8 requires >=22.12. Do not lower this without checking.
          node-version: "22.x"
          cache: npm

      # `npm ci` over `npm install` so CI builds the locked tree and fails loudly
      # if package.json and package-lock.json ever drift apart.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Guards the invariant that every relative import under src/ names a real
      # file. Extensionless imports previously left 28 tests silently unrun.
      - name: Check import extensions
        run: npm run lint:imports

      - name: Test (TypeScript)
        run: npm run test:ts

      # No .grok/app-env.json in CI, and there should not be — it is gitignored.
      # The build wrapper treats it as optional, so this matches a clean clone.
      - name: Build
        run: npm run build

      # --- Known-failing, reported but not blocking ----------------------------
      # These two are red on main today for reasons that predate this workflow.
      # They run so regressions stay visible, but they do not gate the build;
      # gating on them would just make main permanently red and train everyone
      # to ignore CI. Drop the continue-on-error line as each is fixed.

      # 1 error: no-empty at src/lib/app-data/client.server.ts:214, plus 3 warnings.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      # 15 of 214 fail: leftover Grok App Builder scaffolding tests.
      - name: Test (mjs, non-blocking)
        run: npm run test:mjs
        continue-on-error: true
